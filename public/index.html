<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 就业核查台</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#e4ebf3;--blue:#1d4ed8;--green:#0f766e;--red:#b42318;--amber:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
header{background:linear-gradient(135deg,#0f2a4a,#153e75);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0;letter-spacing:1px}header .sub{font-size:12px;opacity:.75;margin-top:4px}
nav{display:flex;gap:8px}nav button{border:0;background:rgba(255,255,255,.12);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
nav button.active{background:#fff;color:#153e75}
main{max-width:1280px;margin:22px auto;padding:0 20px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 6px 18px rgba(15,42,74,.05)}
.card .n{font-size:28px;font-weight:700;color:var(--blue)}.card .l{font-size:12px;color:var(--muted);margin-top:4px}
.card.green .n{color:var(--green)}.card.amber .n{color:var(--amber)}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 6px 18px rgba(15,42,74,.04)}
.panel h2{font-size:15px;margin:0 0 12px;padding-left:9px;border-left:3px solid var(--blue)}
.bar{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;font-size:12px;margin:8px 0}
.track{background:#eef3f9;height:9px;border-radius:7px;overflow:hidden}.track i{display:block;height:100%;background:var(--blue);border-radius:7px}
.bar b{text-align:right}
.legend{font-size:11px;color:var(--muted);display:flex;gap:14px;margin-bottom:8px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--blue)}
.legend .closed::before{background:#e05a47}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid #f1f5fa;vertical-align:top}
tr.row{cursor:pointer}tr.row:hover{background:#f8fbff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;white-space:nowrap}
.badge.build{background:#e8f7ef;color:#067647}.badge.adjacent{background:#eef4ff;color:#1d4ed8}.badge.exposed{background:#fff4e5;color:#b45309}.badge.none{background:#f1f5f9;color:#64748b}
.badge.verified{background:#e8f7ef;color:#067647}.badge.trusted{background:#eef4ff;color:#1d4ed8}.badge.pending{background:#fff7ed;color:#b45309}.badge.low{background:#fef2f2;color:#b42318}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
input{min-width:220px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:520px;max-width:94vw;background:#fff;box-shadow:-10px 0 30px rgba(15,42,74,.16);padding:22px;overflow:auto;transform:translateX(105%);transition:.2s}
.drawer.open{transform:none}.drawer h3{margin:0 0 4px;font-size:18px}.drawer .meta{font-size:12px;color:var(--muted);margin-bottom:14px}
.drawer .kv{font-size:12px;line-height:1.9;color:#334155}.drawer .kv b{color:#0f172a}
.close{float:right;border:0;background:#f1f5f9;border-radius:8px;padding:6px 10px;cursor:pointer}
.empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center}
.pager{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:11px;padding:26px 0}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.drawer{width:100%}}
</style>
</head>
<body>
<header>
  <div><h1>AI 就业核查台</h1><div class="sub">岗位分类 · 链接核验 · 来源可追溯</div></div>
  <nav>
    <button data-view="dashboard" class="active">总览</button>
    <button data-view="jobs">岗位库</button>
    <button data-view="signals">就业舆情</button>
    <button data-view="report">日报</button>
    <button data-view="sources">数据源</button>
  </nav>
</header>
<main>
  <section id="view-dashboard">
    <div class="cards" id="cards"></div>
    <div class="grid">
      <div class="panel"><h2>近 14 天新增 / 关闭</h2><div class="legend"><span>新增</span><span class="closed">关闭</span></div><div id="trend"></div></div>
      <div class="panel"><h2>链接核验分布</h2><div id="levels"></div></div>
    </div>
    <div class="grid">
      <div class="panel"><h2>在招最多的公司</h2><div id="companies"></div></div>
      <div class="panel"><h2>缺口提示</h2><div class="kv" id="notes"></div></div>
    </div>
  </section>

  <section id="view-jobs" hidden>
    <div class="panel">
      <h2>岗位库</h2>
      <div class="toolbar">
        <input id="q" placeholder="搜公司 / 岗位">
        <select id="f-company"><option value="">全部公司</option></select>
        <select id="f-ai"><option value="ai">只看 AI 岗位</option><option value="build">AI 研发（build）</option><option value="adjacent">AI 支撑（adjacent）</option></select>
        <select id="f-level"><option value="">全部核验状态</option><option value="已验证">链接核验通过</option><option>可信</option><option>待核验</option><option>低可信</option></select>
        <select id="f-since"><option value="2026-06-01">2026-06-01 起</option></select>
        <select id="f-status"><option value="open">在招</option></select>
        <button onclick="loadJobs(0)">筛选</button>
      </div>
      <div id="jobs-meta" class="meta"></div>
      <table><thead><tr><th>公司</th><th>岗位</th><th>地点</th><th>AI</th><th>链接核验</th><th>发布时间</th><th>首次发现</th><th>状态</th></tr></thead><tbody id="jobs-body"></tbody></table>
      <div class="pager"><button onclick="pageJobs(-1)">上一页</button><button onclick="pageJobs(1)">下一页</button></div>
    </div>
  </section>

  <section id="view-signals" hidden>
    <div class="panel"><h2>AI 就业信息</h2>
      <p style="font-size:12px;color:#64748b">已复核记录与待核验线索分别展示，每次最多显示50条。静态版每类最多收录最近采到的200条。搜索标注日期尚未核实；招聘线索不代表目前仍在招。</p>
      <div class="toolbar">
        <select id="signal-review"><option value="approved">已复核记录</option><option value="pending">待核验线索</option></select>
        <select id="signal-category"><option value="">全部变化</option><option value="hiring">招聘</option><option value="layoff">裁员</option><option value="shrink">缩招</option><option value="freeze">停招</option></select>
        <label>从 <input id="signal-since" type="date" style="min-width:140px"></label>
        <label>至 <input id="signal-until" type="date" style="min-width:140px"></label>
        <button onclick="loadSignals()">筛选</button>
      </div>
      <div id="signals-list"></div></div>
  </section>

  <section id="view-report" hidden>
    <div class="panel"><h2>今日日报</h2><div id="report-body"></div></div>
  </section>

  <section id="view-sources" hidden>
    <div class="panel"><h2>数据源健康</h2><table><thead><tr><th>公司</th><th>ATS</th><th>岗位数</th><th>链接核验通过</th><th>最近看到</th></tr></thead><tbody id="sources-body"></tbody></table></div>
  </section>
</main>
<div class="drawer" id="drawer"><button class="close" onclick="closeDrawer()">关闭</button><div id="drawer-body"></div></div>
<footer>数据来自公开招聘来源；时间显示为北京时间（Asia/Shanghai）。链接核验不代表岗位真实性或当前可投递；仅覆盖已收录来源。</footer>

<script>
(function(){
  var cache = {};
  async function data(){
    if(!cache.d){ var r = await orig('./console-data.json', {cache:'no-cache'}); if(!r.ok) throw new Error('Dataset HTTP '+r.status); cache.d = await r.json(); }
    return cache.d;
  }
  var orig = window.fetch ? window.fetch.bind(window) : null;
  function resp(obj){ return new Response(JSON.stringify(obj), {status:200, headers:{'Content-Type':'application/json'}}); }
  window.fetch = async function(input, init){
    var u = (typeof input === 'string') ? input : ((input && input.url) || '');
    var url = new URL(u, location.href);
    if (url.origin !== location.origin || url.pathname.indexOf('/api/') !== 0) return orig ? orig(input, init) : Promise.reject(new Error('no fetch'));
    var d = await data();
    var since = url.searchParams.get('since');
    if (url.pathname !== '/api/signals' && since && since !== d.stats.window_since) return new Response(JSON.stringify({error:'Unsupported static date window'}), {status:400});
    var localDates = d.meta && d.meta.display_timezone === 'Asia/Shanghai';
    var timeWarning = localDates ? '' : '旧数据尚未按北京时间重新导出；当日入库与趋势暂不展示。';
    if (url.pathname === '/api/stats') return resp(Object.assign({}, d.stats, {generated_at:d.generated_at, time_warning:timeWarning, today_new:localDates?d.stats.today_new:null, trend:localDates?d.stats.trend:[]}));
    if (url.pathname === '/api/sources') return resp({items: d.sources.map(function(s){
      var jobs = d.jobs.filter(function(j){return j.company === s.name && j.status === 'open';});
      return Object.assign({}, s, {jobs:jobs.length, verified:jobs.filter(function(j){return j.authenticity_level === '已验证';}).length});
    })});
    if (url.pathname === '/api/signals') {
      var p = url.searchParams, review = p.get('review') || 'approved';
      if (review !== 'approved' && review !== 'pending') return new Response(JSON.stringify({error:'unsupported review status'}), {status:400});
      // Older datasets have no review metadata: never promote their RSS entries to reviewed events.
      var items = review === 'pending' ? (d.signal_candidates || []) : (d.signals || []).filter(function(x){return x.review_status === 'approved';});
      var category = p.get('category'), until = p.get('until');
      if(category && !['hiring','layoff','shrink','freeze'].includes(category)) return new Response(JSON.stringify({error:'unsupported event category'}), {status:400});
      if(category) items = items.filter(function(x){return x.category === category;});
      function timestamp(v){return Date.parse(/^\d{4}-\d{2}-\d{2}$/.test(v) ? v+'T00:00:00+08:00' : v);}
      if((since && !Number.isFinite(timestamp(since))) || (until && !Number.isFinite(timestamp(until))) || (since && until && timestamp(since)>=timestamp(until))) return new Response(JSON.stringify({error:'invalid date bounds'}), {status:400});
      if(since) items = items.filter(function(x){return x.published_at && timestamp(x.published_at) >= timestamp(since);});
      if(until) items = items.filter(function(x){return x.published_at && timestamp(x.published_at) < timestamp(until);});
      var cap = Math.min(200,Math.max(1,parseInt(p.get('limit') || '50',10)||50));
      return resp({items:items.slice(0,cap)});
    }
    if (url.pathname === '/api/report') return resp(Object.assign({}, d.report, {today_new:localDates?d.report.today_new:null, signals:(d.signals||[]).filter(function(x){return x.review_status === 'approved';}).length, signal_candidates:(d.signal_candidates||[]).length, note:timeWarning+' 仅统计收录窗口内在招 AI 岗位；链接核验通过代表最近一次 URL 核验通过，不保证当前仍可投递。剔除与合并数为库内累计。'}));
    if (url.pathname === '/api/jobs') {
      var p = url.searchParams;
      var status = p.get('status') || 'open';
      if(status !== 'open') return new Response(JSON.stringify({error:'Static dataset only includes open jobs'}), {status:400});
      var items = d.jobs.filter(function(j){return j.status === status;});
      var q = (p.get('q') || '').trim().toLowerCase();
      if (q) items = items.filter(function(j){ return ((j.title||'') + ' ' + (j.company||'')).toLowerCase().indexOf(q) >= 0; });
      var company = p.get('company');
      if (company) items = items.filter(function(j){ return j.company === company; });
      var ai = p.get('ai');
      if (ai === 'ai') items = items.filter(function(j){ return j.ai_relevance === 'build' || j.ai_relevance === 'adjacent'; });
      else if (ai) items = items.filter(function(j){ return j.ai_relevance === ai; });
      var level = p.get('level');
      if (level) items = items.filter(function(j){ return j.authenticity_level === level; });
      var total = items.length;
      var limit = Math.min(100, Math.max(1, parseInt(p.get('limit') || '30', 10) || 30));
      var offset = Math.max(0, parseInt(p.get('offset') || '0', 10) || 0);
      return resp({total: total, limit: limit, offset: offset, since: d.stats.window_since,
                   items: items.slice(offset, offset + limit)});
    }
    var m = url.pathname.match(/^\/api\/jobs\/(.+)$/);
    if (m) {
      var id = decodeURIComponent(m[1]);
      var job = null;
      for (var i = 0; i < d.jobs.length; i++) if (d.jobs[i].id === id) { job = d.jobs[i]; break; }
      if (!job) return new Response(JSON.stringify({error:'not found'}), {status:404});
      return resp({job: job, snapshots: [], changes: [], history_available: false});
    }
    return new Response(JSON.stringify({error:'not found'}), {status:404});
  };
})();
</script>

<script>
const $ = s => document.querySelector(s);
let jobOffset = 0, jobTotal = 0;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function badge(v){const m={'build':'build','adjacent':'adjacent','exposed':'exposed','none':'none'};const l={'build':'AI研发','adjacent':'AI支撑','exposed':'受影响','none':'非AI'};return `<span class="badge ${m[v]||'none'}">${esc(l[v]||v)}</span>`;}
function levelBadge(v){const m={'已验证':'verified','可信':'trusted','待核验':'pending','低可信':'low'};return `<span class="badge ${m[v]||'pending'}">${esc(v==='已验证'?'链接核验通过':v)}</span>`;}
function fmt(s){if(!s)return '—';const raw=String(s);if(/^\d{4}-\d{2}-\d{2}$/.test(raw))return raw;if(!/(Z|[+-]\d{2}:?\d{2})$/i.test(raw))return esc(raw.replace('T',' '));const d=new Date(raw);if(isNaN(d.getTime()))return esc(raw);const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d);const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`;}
async function api(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
function curSince(){const v=$('#f-since')?$('#f-since').value:'recent';return v==='recent'?'':v;}
async function loadDashboard(){
  const since=curSince();
  const d=await api('/api/stats'+(since?'?since='+encodeURIComponent(since):''));
  $('#cards').innerHTML=[['AI 岗位',d.ai_total,''],['AI 研发',d.build,'green'],['AI 支撑',d.adjacent,''],['链接核验通过',d.verified,'green'],['累计剔除非 AI',d.excluded,'amber']]
    .map(([l,n,c])=>`<div class="card ${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  renderTrend(d.trend||[]);
  if(d.time_warning)$('#trend').innerHTML='<div class="empty">'+esc(d.time_warning)+'</div>';
  const max=Math.max(...(d.levels||[]).map(x=>x.value),1);
  $('#levels').innerHTML=(d.levels||[]).map(x=>`<div class="bar"><span>${esc(x.label==='已验证'?'链接核验通过':x.label)}</span><span class="track"><i style="width:${x.value/max*100}%;background:${x.label==='已验证'?'#0f766e':x.label==='低可信'?'#b42318':'#1d4ed8'}"></i></span><b>${x.value}</b></div>`).join('')||'<div class="empty">暂无</div>';
  const cmax=Math.max(...(d.top_companies||[]).map(x=>x.value),1);
  $('#companies').innerHTML=(d.top_companies||[]).map(x=>`<div class="bar"><span>${esc(x.label)}</span><span class="track"><i style="width:${x.value/cmax*100}%"></i></span><b>${x.value}</b></div>`).join('')||'<div class="empty">暂无</div>';
  $('#notes').innerHTML=`<div>• 数据版本时间：${fmt(d.generated_at)}</div><div>• 时间窗口：<b>${d.window_since}</b> 起（按来源发布时间筛选；岗位库仅提供在招 AI 岗位）</div><div>• 数据版本当日入库（北京时间）：<b>${d.today_new??'待重新导出'}</b></div><div>• 存活复检：<b>${d.liveness_checked||0}</b> 条已核（全库累计：已关闭 ${d.closed||0} · 长期未见 ${d.stale||0}）</div><div>• 库内累计剔除非 AI 岗位 <b>${d.excluded||0}</b> 条（词典判定 none，保留原始记录不物理删除）</div><div>• 库内累计合并重复：<b>${d.merged||0}</b> 条（累计记录数）</div><div>• 链接核验通过 ${d.verified} 条，其余为其他核验状态；以最后核验时间为准，不保证当前仍可投递。</div><div>• 口径：build=直接研发 AI，adjacent=直接支撑 AI；关键词采集，非全站岗位。</div>`;
}
function renderTrend(rows){
  if(!rows.length){$('#trend').innerHTML='<div class="empty">暂无趋势</div>';return;}
  if(rows.length===1){
    const r=rows[0],max=Math.max(r.new_jobs||0,r.closed_jobs||0,1);
    $('#trend').innerHTML=`<div class="bar"><span>${esc(r.day)} 新增</span><span class="track"><i style="width:${(r.new_jobs||0)/max*100}%;background:#1d4ed8"></i></span><b>${r.new_jobs||0}</b></div>
    <div class="bar"><span>${esc(r.day)} 关闭</span><span class="track"><i style="width:${(r.closed_jobs||0)/max*100}%;background:#e05a47"></i></span><b>${r.closed_jobs||0}</b></div>
    <p style="font-size:12px;color:#64748b">当前窗口只有一天事件记录，暂以条形图展示。</p>`;
    return;
  }
  const W=620,H=210,PL=34,PR=12,PT=12,PB=26;
  const max=Math.max(...rows.map(r=>Math.max(r.new_jobs||0,r.closed_jobs||0)),1);
  const x=i=>PL+(W-PL-PR)*i/Math.max(rows.length-1,1);
  const y=v=>PT+(H-PT-PB)*(1-v/max);
  const line=(key,color)=>{const pts=rows.map((r,i)=>`${x(i).toFixed(1)},${y(r[key]||0).toFixed(1)}`).join(' ');return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2"/>`;};
  const labels=rows.map((r,i)=> i%3===0?`<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="9" fill="#94a3b8" text-anchor="middle">${esc(r.day.slice(5))}</text>`:'').join('');
  $('#trend').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="210">
  ${[0,1,2,3].map(k=>`<line x1="${PL}" y1="${y(max*k/3).toFixed(1)}" x2="${W-PR}" y2="${y(max*k/3).toFixed(1)}" stroke="#eef3f9"/>`).join('')}
  ${line('new_jobs','#1d4ed8')}${line('closed_jobs','#e05a47')}${labels}
  ${rows.map((r,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(r.new_jobs||0).toFixed(1)}" r="2.2" fill="#1d4ed8"/>`).join('')}</svg>`;
}
async function loadJobs(offset=jobOffset){
  jobOffset=offset;
  const p=new URLSearchParams({limit:30,offset,status:$('#f-status').value||'open'});
  if($('#q').value.trim())p.set('q',$('#q').value.trim());
  if($('#f-company').value)p.set('company',$('#f-company').value);
  if($('#f-ai').value)p.set('ai',$('#f-ai').value);
  if($('#f-level').value)p.set('level',$('#f-level').value);
  if(curSince())p.set('since',curSince());
  const d=await api('/api/jobs?'+p);
  jobTotal=d.total;
  $('#jobs-meta').textContent=`共 ${d.total} 条，当前 ${d.items.length?d.offset+1:0}-${Math.min(d.offset+d.items.length,d.total)}`;
  $('#jobs-body').innerHTML=d.items.map(j=>`<tr class="row" onclick="openJob('${j.id}')">
    <td>${esc(j.company)}</td><td>${esc(j.title)}</td><td>${esc(j.location||'—')}</td>
    <td>${badge(j.ai_relevance)}</td><td>${levelBadge(j.authenticity_level)}</td>
    <td>${fmt(j.posted_at).slice(0,10)}</td><td>${fmt(j.first_seen).slice(0,10)}</td><td>${esc(j.status)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">没有匹配岗位</td></tr>';
}
function pageJobs(delta){const next=jobOffset+delta*30;if(next<0||next>=jobTotal)return;loadJobs(next);}
async function openJob(id){
  const d=await api('/api/jobs/'+encodeURIComponent(id));const j=d.job;
  $('#drawer-body').innerHTML=`<h3>${esc(j.title)}</h3><div class="meta">${esc(j.company)} · ${esc(j.location||'')} · ${esc(j.ai_relevance)} · ${levelBadge(j.authenticity_level)}</div>
  <div class="kv"><div><b>来源：</b>${esc(j.source)}</div><div><b>状态：</b>${esc(j.status)}</div>
  <div><b>首次发现：</b>${fmt(j.first_seen)}</div><div><b>最近看到：</b>${fmt(j.last_seen)}</div>
  <div><b>最后核验：</b>${fmt(j.last_verified_at||'')}</div><div><b>HTTP：</b>${esc(j.http_status??'—')}</div>
  <div><b>存活判定：</b>${esc(j.liveness||'未复检')} ${esc(j.liveness_reason||'')}</div>
  <div><b>AI 判定依据：</b>${esc(j.ai_reason||'—')}</div>
  <div><b>申请链接：</b><a href="${esc(j.url||'#')}" target="_blank" rel="noreferrer">打开原始岗位</a></div>
  <div><b>薪资：</b>${j.salary_min?`${esc(j.currency||'')} ${j.salary_min}–${j.salary_max||''}`:'未披露'}</div></div>
  <p style="font-size:12px;color:#64748b;margin-top:16px">链接核验通过仅代表最近一次 URL 核验通过；不代表岗位真实性或当前仍可投递。核验分数不是概率。</p>`;
  $('#drawer').classList.add('open');
}
function closeDrawer(){$('#drawer').classList.remove('open');}
function signalUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?esc(u.href):'#';}catch{return '#';}}
async function loadSignals(){
  const p=new URLSearchParams({review:$('#signal-review').value,limit:'50'});
  if($('#signal-category').value)p.set('category',$('#signal-category').value);
  if($('#signal-since').value)p.set('since',$('#signal-since').value);
  if($('#signal-until').value){const end=new Date($('#signal-until').value+'T00:00:00Z');end.setUTCDate(end.getUTCDate()+1);p.set('until',end.toISOString().slice(0,10));}
  const labels={unverified:'事实待核验',denial_candidate:'可能为否认/辟谣',speculation_candidate:'可能为传闻/预测',reported:'媒体报道',official_announcement:'官方宣布',implemented:'已实施',denied:'否认/更正',rumor:'传闻',prediction:'预测'};
  const scopes={pending:'AI关联待复核',ai_role:'AI岗位',ai_team:'AI团队',ai_impact:'来源声称AI影响',ai_company_other:'AI企业其他岗位'};
  try{
    const d=await api('/api/signals?'+p);
    $('#signals-list').innerHTML=(d.items||[]).map(x=>`<div class="event" style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eef3f9"><span class="badge none">${esc(x.tag)}</span><div><a href="${signalUrl(x.url)}" target="_blank" rel="noreferrer" style="color:#172033;text-decoration:none;font-weight:600">${esc(x.title)}</a><div style="font-size:12px;color:#64748b;margin-top:4px">${esc(x.source)} · ${x.date_basis==='source_verified'?'原文发布时间':x.date_basis==='search_index'?'搜索标注时间（待核实）':'发布时间未知'}：${fmt(x.published_at)} · ${esc(labels[x.claim_status]||'事实待核验')} · ${esc(scopes[x.ai_scope]||'AI关联待复核')}</div><div style="font-size:12px;margin-top:6px">${esc(x.summary||'')}</div><div class="meta">最近采到：${fmt(x.last_seen)}；招聘有效性：${x.liveness==='active'?'最近核验可申请':'未确认'}${x.last_verified_at?'（'+fmt(x.last_verified_at)+'）':''}</div></div></div>`).join('')||'<div class="empty">当前筛选下暂无记录</div>';
  }catch(e){$('#signals-list').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';}
}
async function loadReport(){
  const d=await api('/api/report');
  $('#report-body').innerHTML=`<div class="kv" style="font-size:13px;line-height:2">
    <div><b>生成时间：</b>${fmt(d.generated_at)}</div>
    <div><b>AI 岗位：</b>共 ${d.total} 条（AI 研发 ${d.build} · AI 支撑 ${d.adjacent}），库内累计剔除非 AI ${d.excluded||0} 条</div>
    <div><b>链接核验：</b>通过 ${d.verified} 条，其他核验状态 ${d.pending} 条</div>
    <div><b>数据版本当日入库（北京时间）：</b>${d.today_new??'待重新导出'} 条；库内累计合并重复 ${d.merged||0} 条；监控公司 ${d.companies} 家；本批已复核信息 ${d.signals} 条；待核验线索 ${d.signal_candidates||0} 条</div>
    <div><b>Top 公司：</b>${(d.top_companies||[]).map(x=>x.label+' '+x.value).join(' · ')}</div>
    <div style="margin-top:10px;color:#64748b">${esc(d.note)}</div></div>`;
}
async function loadSources(){
  const d=await api('/api/sources');
  $('#sources-body').innerHTML=d.items.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.ats_type)}</td><td>${s.jobs}</td><td>${s.verified||0}</td><td>${fmt(s.last_seen)}</td></tr>`).join('');
}
async function init(){
  await loadDashboard();
  const s=await api('/api/sources');
  $('#f-company').innerHTML='<option value="">全部公司</option>'+s.items.map(x=>`<option>${esc(x.name)}</option>`).join('');
  await loadJobs(0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  ['dashboard','jobs','signals','report','sources'].forEach(v=>$('#view-'+v).hidden=(v!==b.dataset.view));
  if(b.dataset.view==='jobs')loadJobs(0);
  if(b.dataset.view==='signals')loadSignals();
  if(b.dataset.view==='report')loadReport();
  if(b.dataset.view==='sources')loadSources();
});
document.querySelectorAll('#f-since,#f-ai,#f-level,#f-status').forEach(s=>s.onchange=()=>{loadJobs(0);loadDashboard();});
init().catch(e=>{document.querySelector('main').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';});
</script>
</body>
</html>
